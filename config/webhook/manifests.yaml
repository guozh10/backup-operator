---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-backup-mybackup-com-v1alpha1-backuptask
  failurePolicy: Fail
  name: mbackuptask-v1alpha1.kb.io
  rules:
  - apiGroups:
    - backup.mybackup.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - backuptasks
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-backup-mybackup-com-v1alpha1-backuptask
  failurePolicy: Fail
  name: vbackuptask-v1alpha1.kb.io
  rules:
  - apiGroups:
    - backup.mybackup.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - backuptasks
  sideEffects: None
