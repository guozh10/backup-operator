---
# 加密密钥 Secret
apiVersion: v1
kind: Secret
metadata:
  name: backup-encryption-key
  namespace: backup-system
type: Opaque
stringData:
  key: "your-encryption-key-here"

# MySQL 凭证 Secret
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: backup-system
type: Opaque
stringData:
  username: "backupuser"
  password: "yourpassword"


